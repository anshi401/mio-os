[config.wallpaper]
command = "awww img {{ image }} --transition-type center --transition-fps 60 --transition-bezier 0.27,1.06,0.18,1.00 --transition-duration 3.5"
set = true

[templates.hyprland-conf]
input_path = "./templates/hyprland-colors.conf"
output_path = "~/.mio-os/.config/hypr/colors/colors.conf"

[templates.hyprland-lua]
input_path = "./templates/hyprland-colors.lua"
output_path = "~/.mio-os/.config/hypr/colors/colors.lua"

[templates.kitty]
input_path = "./templates/kitty-colors.conf"
output_path = "~/.mio-os/.config/kitty/colors.conf"

[templates.rofi]
input_path = "./templates/rofi-colors.rasi"
output_path = "~/.mio-os/.config/rofi/colors.rasi"

[templates.waybar]
input_path = "./templates/colors.css"
output_path = "~/.mio-os/.config/waybar/colors.css"

[templates.gtk3]
input_path = "./templates/gtk3-colors.css"
output_path = "~/.mio-os/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "./templates/gtk4-colors.css"
output_path = "~/.mio-os/.config/gtk-4.0/colors.css"

[templates.dunst]
input_path = "./templates/dunstrc-colors"
output_path = "~/.mio-os/.config/dunst/dunstrc"

[templates.qt6ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.mio-os/.config/qt6ct/colors/matugen.conf"

[templates.qt5ct]
input_path = "./templates/qtct-colors.conf"
output_path = "~/.mio-os/.config/qt5ct/colors/matugen.conf"

[templates.zed]
input_path = './templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.equibop1]
input_path = './templates/discord-system24.css'
output_path = '~/.config/equibop/themes/system24.css'

[templates.equibop2]
input_path = './templates/discord-midnight.css'
output_path = '~/.config/equibop/themes/midnight.css'

[templates.btop]
input_path = './templates/btop-colors.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.feishin-css]
input_path = './templates/feishin.css'
output_path = '~/.config/feishin/Themes/overrides/matugen.css'

[templates.feishin]
input_path = './templates/feishin.json'
output_path = '~/.config/feishin/Themes/matugen.json'

[templates.feishin-colorful]
input_path = './templates/feishin-colorful.json'
output_path = '~/.config/feishin/Themes/matugen-colorful.json'

[templates.papirus-folders]
input_path = '~/.config/matugen/templates/papirus-color'
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
post_hook = "SUDO_ASKPASS=~/.mio-os/.local/bin/askPassword.sh sudo -A true && notify-send -i 'dialog-information-symbolic' 'Updating folders' 'Applying folder color scheme...' -h string:x-canonical-private-synchronous:wallpaper_changer -t 4000 && papirus-folders -C {{ closest_color }} --theme Papirus-Dark"
index = 1
